# Synthetic-4: identity-preserving (endomorphic) constituents and controls.
#
# Same core as Synthetic-1 plus
#   * right modifier         VP  + Adv  -> VP     "John runs quickly."
#   * left modifier (lexical) Adj + Nn   -> Nn     "the old dog sleeps."
#   * left sentence modifier AdvS + S   -> S      "apparently John runs."
#   * internal insertion     Deg + Vt   -> Vt     "John really likes Mary."   (attachment level: Vt)
# and non-modifier controls that produce the same surface patterns:
#   * Det + Nn -> NP with bare-noun sentences:  "dog sleeps." / "the dog sleeps."  (A. / XA. but Nn -> NP, category changes)
#   * Vt + NP -> VP:                            "likes Mary" is never deletable, must not become a modifier
#   * Nn + VP -> S, Vt + Nn -> VP:              category-changing composition with deletable-looking parts
# Gold modifier structure = every rule whose result class equals one of its children
# (the generator records it per occurrence; see modifier_eval.gold_modifiers).
name: synthetic4_modifier
start: S
max_depth: 5
max_length: 15
classes:
  S: {}
  NP:
    lexicon: {John: 1, Mary: 1, Bill: 1, Sue: 1, Tom: 1, Anna: 1}
    lex_weight: 1.0
  Det:
    lexicon: {the: 3, a: 2, every: 1, some: 1}
  Nn:
    lexicon: {dog: 1, cat: 1, man: 1, woman: 1, bird: 1, child: 1, horse: 1, teacher: 1}
    lex_weight: 2.0
  Adj:
    lexicon: {big: 1, small: 1, old: 1, young: 1, red: 1, happy: 1}
  VP:
    lexicon: {sleeps: 1, runs: 1, laughs: 1, jumps: 1, sings: 1, waits: 1}
    lex_weight: 1.0
  Vt:
    lexicon: {sees: 1, likes: 1, chases: 1, hears: 1, finds: 1, knows: 1}
  Adv:
    lexicon: {quickly: 1, slowly: 1, quietly: 1, today: 1, often: 1}
  AdvS:
    lexicon: {apparently: 1, probably: 1, maybe: 1, sometimes: 1}
  Deg:
    lexicon: {really: 1, almost: 1, clearly: 1}
rules:
  - {left: NP,   right: VP,  result: S,  weight: 1.0}
  - {left: Det,  right: Nn,  result: NP, weight: 1.5}
  - {left: Adj,  right: Nn,  result: Nn, weight: 0.8}
  - {left: Vt,   right: NP,  result: VP, weight: 1.2}
  - {left: VP,   right: Adv, result: VP, weight: 0.45}
  - {left: AdvS, right: S,   result: S,  weight: 0.3}
  - {left: Deg,  right: Vt,  result: Vt, weight: 0.4}
  - {left: Nn,   right: VP,  result: S,  weight: 0.25}
  - {left: Vt,   right: Nn,  result: VP, weight: 0.3}
