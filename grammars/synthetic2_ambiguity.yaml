# Synthetic-2: same grammar as Synthetic-1 plus four surface expressions that
# belong to two different latent categories depending on the occurrence.
# Both categories of every ambiguous word are also used by other words.
#
# `ambiguity: word: {ClassA: p, ClassB: q}` adds the word to both lexicons with
# a weight that makes its occurrences split roughly p : q.
name: synthetic2_ambiguity
start: S
max_depth: 5
max_length: 15
classes:
  S: {}
  NP:
    lexicon: {John: 1, Mary: 1, Bill: 1, Sue: 1, Tom: 1, Anna: 1}
    lex_weight: 1.0
  Det:
    lexicon: {the: 3, a: 2, every: 1, some: 1}
  Nn:
    lexicon: {dog: 1, cat: 1, man: 1, woman: 1, bird: 1, child: 1, horse: 1, teacher: 1}
    lex_weight: 2.0
  Adj:
    lexicon: {big: 1, small: 1, old: 1, young: 1, red: 1, happy: 1}
  VP:
    lexicon: {sleeps: 1, runs: 1, laughs: 1, jumps: 1, sings: 1, waits: 1}
    lex_weight: 1.0
  Vt:
    lexicon: {sees: 1, likes: 1, chases: 1, hears: 1, finds: 1, knows: 1}
  Adv:
    lexicon: {quickly: 1, slowly: 1, quietly: 1, today: 1, often: 1}
rules:
  - {left: NP,  right: VP,  result: S,  weight: 1.0}
  - {left: Det, right: Nn,  result: NP, weight: 1.5}
  - {left: Adj, right: Nn,  result: Nn, weight: 0.8}
  - {left: Vt,  right: NP,  result: VP, weight: 1.2}
  - {left: VP,  right: Adv, result: VP, weight: 0.45}
  # bare-noun subjects / objects ('dogs sleep', 'likes cats'): the asymmetry that
  # makes Adj + Nn -> Nn identifiable against the string-equivalent Det + Adj -> Det
  - {left: Nn,  right: VP,  result: S,  weight: 0.25}
  - {left: Vt,  right: Nn,  result: VP, weight: 0.3}
ambiguity:
  duck:  {Nn: 0.6, VP: 0.4}    # "the duck sleeps" / "John duck"
  walks: {VP: 0.6, Vt: 0.4}    # "John walks" / "John walks the dog"
  fast:  {Adj: 0.5, Adv: 0.5}  # "the fast dog" / "runs fast"
  light: {Adj: 0.5, Nn: 0.5}   # "the light dog" / "the light"
